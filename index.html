<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#1e3a8a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Bonus Calendar</title>
<style>
:root{--primary:#1e3a8a;--bg:#f1f5f9;--card:#fff;--border:#94a3b8}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;padding:12px;background:var(--bg);color:#0f172a}
body.dark{--bg:#0f172a;--card:#1e293b;--border:#475569;color:#f8fafc}
body.dark .cal-table,body.dark .stat-box,body.dark input,body.dark select,body.dark textarea,body.dark .modal,body.dark .st-btn,body.dark .btn-outline{background:#1e293b;color:#f8fafc;border-color:#475569}
body.dark td.empty{background:#0f172a}
.container{max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid #cbd5e1;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.login-box{max-width:380px;margin:50px auto;text-align:center}
input,select,textarea{width:100%;padding:10px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:15px;margin-bottom:10px}
.btn{background:var(--primary);color:#fff;border:none;padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.btn-danger{background:#dc2626;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.stat-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:8px}
.stat-box span{display:block;font-size:11px;color:#475569}
.stat-box strong{font-size:20px;color:var(--primary)}
.stat-box.deduct strong{color:#dc2626}
.stat-box.remain strong{color:#16a34a}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
table.cal-table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
.cal-table th{background:#1e3a8a;color:#fff;padding:8px 2px;font-size:12px;border:1px solid #64748b}
.cal-table td{border:1px solid var(--border);height:68px;vertical-align:top;padding:4px;cursor:pointer;position:relative}
.cal-table td.empty{background:#f8fafc;cursor:default}
.day-num{font-size:13px;font-weight:700}
.day-icon{font-size:18px;text-align:center;margin-top:1px}
.has-attach{position:absolute;top:3px;left:3px;font-size:12px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:14px;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:100%;max-width:440px;border-radius:14px;padding:16px;max-height:90vh;overflow-y:auto}
.status-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.st-btn{border:1.5px solid #cbd5e1;background:#f8fafc;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.st-btn.active{border-color:var(--primary);background:#dbeafe;color:#1e3a8a}
.emp-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #e2e8f0}
.icon-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.icon-pick{font-size:18px;padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer;background:#fff;margin-left:3px}
.icon-pick.selected{border:2px solid var(--primary);background:#dbeafe}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="loginScreen" class="card login-box">
<h2 id="t_title" style="color:#1e3a8a;margin-top:0"></h2>
<input type="text" id="loginUser"/>
<input type="password" id="loginPin"/>
<button type="button" id="loginBtn" class="btn" style="width:100%"></button>
<p id="loginError" style="color:#dc2626;font-size:14px;font-weight:bold"></p>
</div>
<div id="appScreen" class="container hidden">
<div class="card">
<div class="top-bar">
<div id="adminControls" class="hidden" style="flex:1;min-width:180px">
<label id="t_selEmp" style="font-size:12px;font-weight:700"></label>
<select id="empSelect" style="margin:0"></select>
</div>
<div id="empTitleBox" class="hidden"><strong style="font-size:17px;color:#1e3a8a" id="empWelcome"></strong></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button type="button" id="b_icons" class="btn-outline" onclick="openIconsModal()"></button>
<button type="button" id="themeBtn" class="btn-outline" onclick="toggleTheme()"></button>
<button type="button" id="manageEmpBtn" class="btn-outline hidden" onclick="openEmpModal()"></button>
<button type="button" id="b_exit" class="btn-danger" onclick="location.reload()"></button>
</div>
</div>
<div class="stats-grid">
<div class="stat-box"><span id="t_goal"></span><strong>180</strong></div>
<div class="stat-box deduct"><span id="t_ded"></span><strong id="deductedCount">0</strong></div>
<div class="stat-box remain"><span id="t_rem"></span><strong id="remainingCount">180</strong></div>
</div>
</div>
<div class="card" style="padding:10px;display:flex;justify-content:space-between;align-items:center">
<button type="button" id="b_prev" class="btn" onclick="changeMonth(-1)"></button>
<strong id="monthLabel"></strong>
<button type="button" id="b_next" class="btn" onclick="changeMonth(1)"></button>
</div>
<div style="border:2px solid #94a3b8;border-radius:10px;overflow:hidden">
<table class="cal-table">
<thead><tr id="daysHead"></tr></thead>
<tbody id="calBody"></tbody>
</table>
</div>
</div>
<div class="modal-backdrop" id="empModal">
<div class="modal">
<h3 id="t_empH" style="margin-top:0;color:#1e3a8a"></h3>
<input type="text" id="newEmpName"/>
<input type="text" id="newEmpUser"/>
<input type="text" id="newEmpPin"/>
<button type="button" id="b_addEmp" class="btn" style="width:100%;margin-bottom:12px" onclick="addEmployee()"></button>
<div id="empList"></div>
<div style="text-align:left;margin-top:12px"><button type="button" id="b_closeEmp" class="btn-outline" onclick="document.getElementById('empModal').classList.remove('open')"></button></div>
</div>
</div>
<div class="modal-backdrop" id="iconsModal">
<div class="modal">
<h3 id="t_icoH" style="margin-top:0;color:#1e3a8a"></h3>
<div id="iconSettingsList"></div>
<div style="text-align:left;margin-top:12px"><button type="button" id="b_doneIco" class="btn" onclick="document.getElementById('iconsModal').classList.remove('open')"></button></div>
</div>
</div>
<div class="modal-backdrop" id="dayModal">
<div class="modal">
<h3 id="modalDateTitle" style="margin-top:0;color:#1e3a8a"></h3>
<div class="status-options" id="statusOptions"></div>
<div id="permTimeBox" class="hidden" style="margin-bottom:10px">
<label id="t_timeL" style="font-size:13px;font-weight:700;display:block;margin-bottom:4px"></label>
<input type="time" id="permTime" style="margin:0"/>
</div>
<textarea id="dayNote" rows="2"></textarea>
<label id="t_attL" style="font-size:13px;font-weight:700;display:block;margin-bottom:4px"></label>
<input type="file" id="dayImageInput" accept="image/*" onchange="handleImageUpload(event)"/>
<div id="imagePreviewContainer"></div>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
<button type="button" id="b_clr" class="btn-danger" onclick="clearDayData()"></button>
<button type="button" id="b_can" class="btn-outline" onclick="document.getElementById('dayModal').classList.remove('open')"></button>
<button type="button" id="b_sav" class="btn" onclick="saveDayData()"></button>
</div>
</div>
</div>
